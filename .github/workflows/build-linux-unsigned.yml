name: build-linux-unsigned

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl git ca-certificates \
            libdbus-1-dev libmnl-dev libnftnl-dev libssl-dev \
            libgtk-3-dev libnotify-dev libayatana-appindicator3-dev librsvg2-dev \
            protobuf-compiler rpm ruby-full
          sudo gem install fpm --no-document

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust (pinned toolchain)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Rust toolchain
        run: |
          cargo --version
          rustc --version

      - name: Build Linux packages
        run: ./build.sh --optimize
        env:
          SOURCE_DATE_EPOCH: "1735689600"

      - name: List artifacts
        if: always()
        run: ls -la dist/ || true

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: SocialCommandVPN-linux
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 14
